<svg xmlns="http://www.w3.org/2000/svg" width="1510" height="910" viewBox="0 0 1510 910" role="img" aria-labelledby="title desc">
  <title id="title">How multiclaude works</title>
  <desc id="desc">A Telegram message reaches the front desk, a Claude Code session that hosts the Telegram plugin; the router reads it there and types it into the sender's own Claude Code assistant, which replies with tg through Telegram's Bot API. The control panel, and the optional Slack, Siri, locations (OwnTracks) and reminders add-ins, reach the router through the relay, a Cloudflare Worker. When a browser needs the person, an assistant runs takeover, which shows them that browser live through a Cloudflare quick tunnel until they tap Done.</desc>
  <!-- The architecture at a glance, kept current with ARCHITECTURE.md. Three columns: the phone, the internet, the machine.
       Solid arrows carry messages in, dashed ones replies out, dotted ones the add-ins' paths; dashed boxes are add-ins.
       Numbered badges follow one Telegram message. The card has its own white background, so it reads the same on light
       and dark pages. -->
  <defs>
    <marker id="in" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,1 L10,5 L0,9 z" fill="#334155"/>
    </marker>
    <marker id="out" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,1 L10,5 L0,9 z" fill="#64748b"/>
    </marker>
    <marker id="opt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,1 L10,5 L0,9 z" fill="#94a3b8"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, "Liberation Sans", sans-serif; fill: #0f172a; }
      .title { font-size: 24px; font-weight: 700; }
      .subtitle { font-size: 14px; fill: #475569; }
      .band { fill: #f8fafc; stroke: #e2e8f0; }
      .band-label { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; fill: #64748b; }
      .group { fill: none; stroke: #a78bfa; stroke-dasharray: 5 4; }
      rect.app { fill: #dbeafe; stroke: #3b82f6; }
      rect.cloud { fill: #fef3c7; stroke: #d97706; }
      rect.program { fill: #dcfce7; stroke: #16a34a; }
      rect.claude { fill: #ede9fe; stroke: #7c3aed; }
      rect.shared { fill: #ffffff; stroke: #94a3b8; }
      rect.addin { fill: #f1f5f9; stroke: #64748b; stroke-dasharray: 6 4; }
      .box rect { stroke-width: 1.5; }
      .box text { font-size: 13px; fill: #334155; text-anchor: middle; }
      .box text.name { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .box text.bullet { text-anchor: start; }
      .box text.tag { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; fill: #64748b; }
      .in { fill: none; stroke: #334155; stroke-width: 1.6; }
      .in.thick { stroke-width: 3.2; }
      .out { fill: none; stroke: #64748b; stroke-width: 1.6; stroke-dasharray: 6 4; }
      .opt { fill: none; stroke: #94a3b8; stroke-width: 1.8; stroke-dasharray: 2 4; }
      .tie { fill: none; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 3 3; }
      .label { font-size: 12px; fill: #334155; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
      .label.middle { text-anchor: middle; }
      .label.faint { fill: #64748b; }
      .step circle { fill: #0f172a; }
      .step text { font-size: 11px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .legend { font-size: 12px; fill: #334155; }
    </style>
  </defs>

  <rect width="1510" height="910" rx="16" fill="#ffffff"/>
  <text class="title" x="30" y="44">How multiclaude works</text>
  <text class="subtitle" x="30" y="70">One Telegram bot, with a personal Claude Code assistant for each person, on one Linux machine. Follow 1 to 7 to see a message go there and back.</text>

  <!-- Columns -->
  <rect class="band" x="20" y="118" width="270" height="672" rx="14"/>
  <text class="band-label" x="36" y="142">ON EACH PERSON'S PHONE</text>
  <rect class="band" x="320" y="118" width="290" height="672" rx="14"/>
  <text class="band-label" x="336" y="142">ON THE INTERNET</text>
  <rect class="band" x="640" y="118" width="840" height="672" rx="14"/>
  <text class="band-label" x="656" y="142">ON THE LINUX MACHINE · RUNNING AROUND THE CLOCK</text>
  <rect class="group" x="1040" y="290" width="250" height="265" rx="12"/>
  <text class="band-label" x="1054" y="309">ONE ASSISTANT PER PERSON</text>

  <!-- On the phone -->
  <g class="box">
    <rect class="app" x="40" y="160" width="220" height="100" rx="10"/>
    <text class="name" x="150" y="188">Telegram</text>
    <text x="150" y="208">a chat with the bot: text,</text>
    <text x="150" y="225">photos, files, replies</text>
    <text x="150" y="242">and buttons</text>
  </g>
  <g class="box">
    <rect class="app" x="40" y="300" width="220" height="100" rx="10"/>
    <text class="name" x="150" y="328">Control panel</text>
    <text x="150" y="348">a Telegram Mini App:</text>
    <text x="150" y="365">model, effort, jobs, MCP</text>
    <text x="150" y="382">servers, usage</text>
  </g>
  <g class="box">
    <rect class="addin" x="40" y="440" width="220" height="70" rx="10"/>
    <text class="tag" x="150" y="456">ADD-IN</text>
    <text class="name" x="150" y="476">On your phone</text>
    <text x="150" y="496">Siri · OwnTracks · Reminders</text>
  </g>
  <g class="box">
    <rect class="addin" x="40" y="550" width="220" height="70" rx="10"/>
    <text class="tag" x="150" y="566">ADD-IN</text>
    <text class="name" x="150" y="586">Slack DM</text>
    <text x="150" y="606">in the Slack app</text>
  </g>

  <!-- On the internet -->
  <g class="box">
    <rect class="cloud" x="370" y="160" width="220" height="100" rx="10"/>
    <text class="name" x="480" y="196">Telegram servers</text>
    <text x="480" y="218">hold each message until</text>
    <text x="480" y="235">the bot fetches it</text>
  </g>
  <g class="box">
    <rect class="cloud" x="370" y="300" width="220" height="320" rx="10"/>
    <text class="name" x="480" y="398">Relay</text>
    <text x="480" y="420">a Cloudflare Worker that</text>
    <text x="480" y="437">keeps panel taps, and what</text>
    <text x="480" y="454">the add-ins' apps send, until</text>
    <text x="480" y="471">the machine collects them.</text>
    <text x="480" y="488">It serves the panel page,</text>
    <text x="480" y="505">and holds the requests of Siri,</text>
    <text x="480" y="522">OwnTracks and Reminders</text>
    <text x="480" y="539">until the answer comes back.</text>
  </g>

  <!-- On the machine -->
  <g class="box">
    <rect class="claude" x="700" y="160" width="240" height="100" rx="10"/>
    <text class="name" x="820" y="188">Front desk</text>
    <text x="820" y="208">Claude Code with the</text>
    <text x="820" y="225">Telegram plugin: receives</text>
    <text x="820" y="242">every message, answers none</text>
  </g>
  <g class="box">
    <rect class="program" x="700" y="300" width="240" height="320" rx="10"/>
    <text class="name" x="820" y="332">Router</text>
    <text x="820" y="352">the assistant-watcher service</text>
    <text class="bullet" x="718" y="386">• finds who wrote in users.json</text>
    <text class="bullet" x="718" y="410">• types the message into</text>
    <text class="bullet" x="731" y="427">the writer's own assistant</text>
    <text class="bullet" x="718" y="451">• runs /clear, /model, /mcp,</text>
    <text class="bullet" x="731" y="468">/config and the rest itself</text>
    <text class="bullet" x="718" y="492">• keeps "typing…" on while</text>
    <text class="bullet" x="731" y="509">the assistant works</text>
    <text class="bullet" x="718" y="533">• puts each person's control</text>
    <text class="bullet" x="731" y="550">panel on the relay</text>
    <text class="bullet" x="718" y="574">• warns as plan limits run out</text>
  </g>
  <g class="box">
    <rect class="shared" x="1040" y="160" width="250" height="100" rx="10"/>
    <text class="name" x="1165" y="188">Shared by every assistant</text>
    <text x="1165" y="208">the rules they all follow,</text>
    <text x="1165" y="225">plugins and skills everyone has,</text>
    <text x="1165" y="242">and users.json: who is who</text>
  </g>
  <g class="box">
    <rect class="claude" x="1060" y="325" width="210" height="110" rx="10"/>
    <text class="name" x="1165" y="351">Ada's assistant</text>
    <text x="1165" y="371">Claude Code in tmux u-ada,</text>
    <text x="1165" y="388">in ~/workspaces/ada, with</text>
    <text x="1165" y="405">its own memory, MCP servers,</text>
    <text x="1165" y="422">skills and chat history</text>
  </g>
  <g class="box">
    <rect class="claude" x="1060" y="450" width="210" height="90" rx="10"/>
    <text class="name" x="1165" y="474">Another assistant</text>
    <text x="1165" y="494">the same for each person:</text>
    <text x="1165" y="511">tmux u-&lt;name&gt; in</text>
    <text x="1165" y="528">~/workspaces/&lt;name&gt;</text>
  </g>
  <g class="box">
    <rect class="program" x="1060" y="570" width="210" height="97" rx="10"/>
    <text class="name" x="1165" y="596">Cron</text>
    <text x="1165" y="616">scheduled jobs: a one-shot</text>
    <text x="1165" y="633">Claude in a person's folder;</text>
    <text x="1165" y="650">health checks warn the owner</text>
  </g>
  <g class="box">
    <rect class="program" x="1330" y="160" width="130" height="100" rx="10"/>
    <text class="name" x="1395" y="188">tg</text>
    <text x="1395" y="208">sends text, files,</text>
    <text x="1395" y="225">buttons and edits</text>
    <text x="1395" y="242">to Telegram</text>
  </g>
  <g class="box">
    <rect class="addin" x="1330" y="470" width="130" height="80" rx="10"/>
    <text class="tag" x="1395" y="488">ADD-IN</text>
    <text class="name" x="1395" y="508">slack</text>
    <text x="1395" y="526">the same, for</text>
    <text x="1395" y="542">Slack DMs</text>
  </g>

  <!-- One Telegram message, there and back -->
  <path class="in" d="M260,190 H368" marker-end="url(#in)"/>
  <g class="step"><circle cx="281" cy="176" r="9"/><text x="281" y="180">1</text></g>
  <text class="label" x="295" y="180">you write</text>

  <path class="in" d="M590,210 H698" marker-end="url(#in)"/>
  <g class="step"><circle cx="611" cy="178" r="9"/><text x="611" y="182">2</text></g>
  <text class="label" x="625" y="182">the plugin</text>
  <text class="label" x="625" y="197">fetches it</text>

  <path class="in" d="M820,260 V298" marker-end="url(#in)"/>
  <g class="step"><circle cx="840" cy="279" r="9"/><text x="840" y="283">3</text></g>
  <text class="label" x="854" y="283">the router reads it</text>

  <path class="in" d="M940,380 H1058" marker-end="url(#in)"/>
  <g class="step"><circle cx="954" cy="343" r="9"/><text x="954" y="347">4</text></g>
  <text class="label" x="968" y="347">typed into</text>
  <text class="label" x="946" y="365">their terminal</text>
  <path class="in" d="M940,495 H1058" marker-end="url(#in)"/>

  <path class="out" d="M1270,380 H1305"/>
  <path class="out" d="M1270,495 H1305"/>
  <path class="out" d="M1270,610 H1305"/>
  <path class="out" d="M1305,610 V210 H1328" marker-end="url(#out)"/>
  <g class="step"><circle cx="1320" cy="300" r="9"/><text x="1320" y="304">5</text></g>
  <text class="label" x="1334" y="304">the reply</text>
  <text class="label" x="1314" y="614">a job's result</text>

  <path class="out" d="M1395,160 V100 H480 V158" marker-end="url(#out)"/>
  <g class="step"><circle cx="760" cy="100" r="9"/><text x="760" y="104">6</text></g>
  <text class="label" x="774" y="104">tg sends the reply through Telegram's Bot API</text>

  <path class="out" d="M370,232 H262" marker-end="url(#out)"/>
  <g class="step"><circle cx="281" cy="248" r="9"/><text x="281" y="252">7</text></g>
  <text class="label" x="295" y="252">you read it</text>

  <!-- The control panel, through the relay -->
  <path class="in" d="M262,350 H368" marker-start="url(#in)" marker-end="url(#in)"/>
  <text class="label middle" x="315" y="341">page and taps</text>

  <path class="in thick" d="M592,460 H698" marker-start="url(#in)" marker-end="url(#in)"/>
  <text class="label middle" x="645" y="450">WebSocket</text>
  <text class="label middle" x="645" y="479">both ways</text>

  <!-- The add-ins' paths: Siri, OwnTracks and Reminders, and Slack, also through the relay -->
  <path class="opt" d="M262,475 H368" marker-start="url(#opt)" marker-end="url(#opt)"/>
  <text class="label middle faint" x="315" y="466">what you send in,</text>
  <text class="label middle faint" x="315" y="493">its answer back</text>

  <path class="opt" d="M260,585 H368" marker-end="url(#opt)"/>
  <text class="label middle faint" x="315" y="576">via Slack's</text>
  <text class="label middle faint" x="315" y="603">servers</text>

  <path class="opt" d="M1305,510 H1328" marker-end="url(#opt)"/>
  <path class="opt" d="M1460,510 H1495 V822 H30 V585 H38" marker-end="url(#opt)"/>
  <text class="label middle faint" x="820" y="826">slack sends replies to Slack DMs through Slack's servers</text>

  <path class="tie" d="M1165,260 V290"/>

  <!-- A browser take-over: the person's phone, the quick tunnel, takeover and the assistant's browser -->
  <g class="box">
    <rect class="app" x="40" y="702" width="220" height="72" rx="10"/>
    <text class="name" x="150" y="726">Browser take-over</text>
    <text x="150" y="746">the browser, live: tap and</text>
    <text x="150" y="763">type into it, then tap Done</text>
  </g>
  <g class="box">
    <rect class="cloud" x="370" y="702" width="220" height="72" rx="10"/>
    <text class="name" x="480" y="726">Quick tunnel</text>
    <text x="480" y="746">a Cloudflare address for one</text>
    <text x="480" y="763">take-over, with no account</text>
  </g>
  <g class="box">
    <rect class="program" x="700" y="702" width="240" height="72" rx="10"/>
    <text class="name" x="820" y="726">takeover</text>
    <text x="820" y="746">an assistant runs it: serves the</text>
    <text x="820" y="763">page, sends you the link</text>
  </g>
  <g class="box">
    <rect class="program" x="1060" y="702" width="210" height="72" rx="10"/>
    <text class="name" x="1165" y="726">The assistant's browser</text>
    <text x="1165" y="746">agent-browser's Chrome,</text>
    <text x="1165" y="763">streaming what it shows</text>
  </g>
  <path class="in" d="M262,738 H368" marker-start="url(#in)" marker-end="url(#in)"/>
  <text class="label middle" x="315" y="729">frames and taps</text>
  <text class="label middle" x="315" y="757">over HTTPS</text>
  <path class="in" d="M592,738 H698" marker-start="url(#in)" marker-end="url(#in)"/>
  <text class="label middle" x="645" y="729">only while</text>
  <text class="label middle" x="645" y="757">it lasts</text>
  <path class="in" d="M942,738 H1058" marker-start="url(#in)" marker-end="url(#in)"/>
  <text class="label middle" x="1000" y="729">its stream,</text>
  <text class="label middle" x="1000" y="757">a WebSocket</text>

  <!-- How to read it -->
  <path class="in" d="M30,858 H76" marker-end="url(#in)"/>
  <text class="legend" x="86" y="862">a message on its way in</text>
  <path class="out" d="M250,858 H296" marker-end="url(#out)"/>
  <text class="legend" x="306" y="862">a reply on its way out</text>
  <path class="opt" d="M460,858 H506" marker-end="url(#opt)"/>
  <text class="legend" x="516" y="862">an add-in's path</text>
  <g class="step"><circle cx="650" cy="858" r="9"/><text x="650" y="862">1</text></g>
  <text class="legend" x="665" y="862">one Telegram message, step by step</text>

  <rect class="app" x="30" y="881" width="16" height="12" rx="3"/>
  <text class="legend" x="54" y="891">an app on the phone</text>
  <rect class="cloud" x="200" y="881" width="16" height="12" rx="3"/>
  <text class="legend" x="224" y="891">a service on the internet</text>
  <rect class="program" x="400" y="881" width="16" height="12" rx="3"/>
  <text class="legend" x="424" y="891">a program on the machine</text>
  <rect class="claude" x="610" y="881" width="16" height="12" rx="3"/>
  <text class="legend" x="634" y="891">a Claude Code session</text>
  <rect class="shared" x="800" y="881" width="16" height="12" rx="3"/>
  <text class="legend" x="824" y="891">files every assistant shares</text>
  <rect class="addin" x="1010" y="881" width="16" height="12" rx="3"/>
  <text class="legend" x="1034" y="891">an add-in, off until the owner turns it on</text>
</svg>
