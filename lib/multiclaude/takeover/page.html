<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=8">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Your turn · {{BOT_NAME}}</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff; --fg: #0f172a; --muted: #64748b; --line: #cbd5e1; --screen: #e2e8f0;
    --done: #16a34a; --done-fg: #ffffff; --note: #dcfce7;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #17212b; --fg: #f1f5f9; --muted: #94a3b8; --line: #334155; --screen: #0f172a; --note: #14532d; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { padding: 12px 16px 8px; }
  #task { margin: 0; font-weight: 600; white-space: pre-wrap; overflow-wrap: anywhere; }
  #status { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
  #screen {
    display: block; width: 100%; height: auto; background: var(--screen);
    touch-action: pinch-zoom;  /* one finger is the person's hand in the browser; two zoom this page */
    -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
  }
  #ended-note { display: none; margin: 0; padding: 12px 16px; background: var(--note); font-weight: 600; }
  .ended #ended-note { display: block; }
  .ended #screen, .ended .controls { opacity: 0.4; pointer-events: none; }
  .controls { display: grid; gap: 10px; padding: 12px 16px 28px; }
  .hint { margin: 0; font-size: 13px; color: var(--muted); }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; min-width: 0; }
  input, button { font: inherit; font-size: 16px; color: inherit; border-radius: 10px; }
  input { padding: 10px 12px; border: 1px solid var(--line); background: transparent; }
  button { padding: 10px 8px; border: 1px solid var(--line); background: transparent; touch-action: manipulation; }
  .row > button[type=submit] { flex: 0 0 auto; padding: 10px 18px; }
  #done { padding: 16px; border: 0; background: var(--done); color: var(--done-fg); font-size: 18px; font-weight: 700; }
  #cant { color: var(--muted); }
</style>
</head>
<body data-bot="{{BOT_NAME}}" data-expires="{{EXPIRES}}">
<header>
  <p id="task">{{TASK}}</p>
  <p id="status"><span id="state">Connecting…</span> · <span id="time-left"></span></p>
</header>
<p id="ended-note" role="status"></p>
<canvas id="screen" aria-label="The browser, live"></canvas>
<div class="controls">
  <p class="hint">Tap, hold or drag on the browser with one finger; pinch with two to zoom. To type, tap the box in the browser, then type here and tap Send.</p>
  <form id="typing" class="row">
    <input id="text" type="text" autocomplete="one-time-code" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Text to type">
    <button type="submit">Send</button>
  </form>
  <div class="row">
    <button type="button" data-key="Enter">⏎ Enter</button>
    <button type="button" data-key="Backspace">⌫ Delete</button>
    <button type="button" data-key="Tab">⇥ Tab</button>
  </div>
  <div class="row">
    <button type="button" data-scroll="up">▲ Scroll up</button>
    <button type="button" data-scroll="down">▼ Scroll down</button>
  </div>
  <button type="button" id="done">✅ Done</button>
  <button type="button" id="cant">I can't do it</button>
</div>
<script>
"use strict";
/*
 * The take-over page (lib/multiclaude/takeover/page.py): the browser's latest frame on a canvas,
 * fetched again as soon as it changes, and what the person does sent back one request at a time,
 * in order, so a press always reaches the browser before its release.
 */
const HOLD_DELAY = 120;   // ms a finger waits before it presses, so the first finger of a pinch clicks nothing
const FRAME_GAP = 100;    // ms at least between frame requests, so an animated page doesn't flood the phone
const RETRY_AFTER = 1500; // ms before trying again after a failed request
const LOST_AFTER = 3;     // failed frame requests in a row before saying the connection is lost
const MINUTE = 60e3;

const screen = document.getElementById("screen");
const painter = screen.getContext("2d");
const textField = document.getElementById("text");
const botName = document.body.dataset.bot;
const expires = Number(document.body.dataset.expires);

const waiting = [];              // requests not sent yet, oldest first: {path, body, then}
let sending = false;
let touch = null;                // the finger (or mouse button) down on the browser: {id, point, timer, pressed}
let lastPoint = { x: 0.5, y: 0.5 };  // where the person last touched, for the scroll buttons
let ended = false;

start();

function start() {
  screen.addEventListener("pointerdown", startTouch);
  screen.addEventListener("pointermove", moveTouch);
  screen.addEventListener("pointerup", endTouch);
  screen.addEventListener("pointercancel", cancelTouch);
  screen.addEventListener("contextmenu", (event) => event.preventDefault());
  document.getElementById("typing").addEventListener("submit", sendText);
  for (const button of document.querySelectorAll("[data-key]")) {
    button.addEventListener("click", () => send({ kind: "key", key: button.dataset.key }));
  }
  for (const button of document.querySelectorAll("[data-scroll]")) {
    button.addEventListener("click", () => send({ kind: "scroll", direction: button.dataset.scroll, ...lastPoint }));
  }
  document.getElementById("done").addEventListener("click",
    () => finish("done", `✅ Done, thank you. ${botName} carries on; you can close this page.`));
  document.getElementById("cant").addEventListener("click",
    () => finish("gave-up", `Thanks for trying. ${botName} takes it from here; you can close this page.`));
  showTimeLeft();
  setInterval(showTimeLeft, MINUTE / 4);
  followFrames();
}

async function followFrames() {
  let seq = 0;
  let failures = 0;
  while (!ended) {
    const asked = Date.now();
    try {
      seq = await nextFrame(seq);
      failures = 0;
    } catch (error) {
      failures += 1;
      if (failures >= LOST_AFTER) showState("Connection lost, retrying…");
      await sleep(RETRY_AFTER);
    }
    await sleep(FRAME_GAP - (Date.now() - asked));
  }
}

/** Draws the next frame newer than seq, if one comes; the seq of the frame shown. */
async function nextFrame(seq) {
  const response = await fetch(`frame?after=${seq}`, { cache: "no-store" });
  if (response.status === 410) {
    end("This link has ended.");
    return seq;
  }
  if (response.status === 204) return seq;
  if (!response.ok) throw new Error(`frame: HTTP ${response.status}`);
  await draw(await response.blob());
  showState("Live");
  return Number(response.headers.get("X-Frame"));
}

function draw(blob) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(blob);
    const image = new Image();
    image.onload = () => {
      paint(image);
      URL.revokeObjectURL(url);
      resolve();
    };
    image.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error("a frame that isn't an image"));
    };
    image.src = url;
  });
}

function paint(image) {
  if (screen.width !== image.naturalWidth || screen.height !== image.naturalHeight) {
    screen.width = image.naturalWidth;
    screen.height = image.naturalHeight;
  }
  painter.drawImage(image, 0, 0);
}

function startTouch(event) {
  if (touch) {
    cancelTouch();  // a second finger: the person is zooming, not pressing
    return;
  }
  if (event.button !== 0) return;
  screen.setPointerCapture(event.pointerId);
  touch = { id: event.pointerId, point: pointOf(event), pressed: false };
  touch.timer = setTimeout(press, event.pointerType === "mouse" ? 0 : HOLD_DELAY);
  lastPoint = touch.point;
}

function press() {
  touch.pressed = true;
  send({ kind: "press", ...touch.point });
}

function moveTouch(event) {
  if (touch?.id !== event.pointerId) return;
  touch.point = pointOf(event);
  if (touch.pressed) send({ kind: "move", ...touch.point });
}

function endTouch(event) {
  if (touch?.id !== event.pointerId) return;
  clearTimeout(touch.timer);
  touch.point = pointOf(event);
  if (!touch.pressed) press();
  send({ kind: "release", ...touch.point });
  touch = null;
}

function cancelTouch() {
  if (!touch) return;
  clearTimeout(touch.timer);
  if (touch.pressed) send({ kind: "release", ...touch.point });
  touch = null;
}

/** Where the pointer is, as fractions of the frame across and down. */
function pointOf(event) {
  const box = screen.getBoundingClientRect();
  return { x: within((event.clientX - box.left) / box.width), y: within((event.clientY - box.top) / box.height) };
}

function within(fraction) {
  return Math.min(1, Math.max(0, fraction));
}

function sendText(event) {
  event.preventDefault();
  if (!textField.value) return;
  send({ kind: "text", text: textField.value });
  textField.value = "";
}

function send(action) {
  const last = waiting[waiting.length - 1];
  if (action.kind === "move" && last?.body.kind === "move") {
    last.body = action;  // only where the drag has got to matters
  } else {
    waiting.push({ path: "input", body: action });
  }
  sendWaiting();
}

function finish(outcome, note) {
  waiting.push({ path: "end", body: { outcome }, then: () => end(note) });
  sendWaiting();
}

async function sendWaiting() {
  if (sending) return;
  sending = true;
  while (waiting.length && !ended) {
    const request = waiting.shift();
    try {
      const response = await post(request.path, request.body);
      if (response.ok) request.then?.();
    } catch (error) {
      waiting.unshift(request);
      showState("Couldn't reach the browser, retrying…");
      await sleep(RETRY_AFTER);
    }
  }
  sending = false;
}

/** POSTs JSON. A request the page got wrong (4xx) is dropped; one that didn't get through throws. */
async function post(path, body) {
  const response = await fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  if (response.status === 410) end("This link has ended.");
  if (response.status >= 500) throw new Error(`${path}: HTTP ${response.status}`);
  return response;
}

function end(note) {
  ended = true;
  document.body.classList.add("ended");
  document.getElementById("ended-note").textContent = note;
  showState("Ended");
  document.getElementById("time-left").textContent = "the link no longer works";
}

function showTimeLeft() {
  if (ended) return;
  const minutes = Math.ceil((expires - Date.now()) / MINUTE);
  if (minutes <= 0) {
    end("This link has expired.");
    return;
  }
  document.getElementById("time-left").textContent = `the link works for ${minutes} more min`;
}

function showState(text) {
  document.getElementById("state").textContent = text;
}

function sleep(ms) {
  return new Promise((resolve) => setTimeout(resolve, Math.max(0, ms)));
}
</script>
</body>
</html>
